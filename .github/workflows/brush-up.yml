name: brush-up

on:
  issue_comment:
    types: [created]

jobs:
  brush:
    if: |
      github.event.comment.user.type != 'Bot' &&
      github.event.issue.pull_request != null &&
      (contains(github.event.comment.body, '/brushup') ||
       contains(github.event.comment.body, '/bs'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure git auth (use_github_token mode)
        run: |
          git config --local user.name "opencode-agent[bot]"
          git config --local user.email "opencode-agent[bot]@users.noreply.github.com"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run OpenCode (brush-up)
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          agent: article-writer
          use_github_token: true
          prompt: |
            # 記事の修正指示（ブラッシュアップ）

            PR に投稿された「コメント本文」を修正指示として受け取り、**必ず記事ファイルを編集して反映**してください。

            ## コメント本文
            ${{ github.event.comment.body }}

            ## 必須の手順
            1. `glob` で `src/content/posts/*.md` を探し、この PR の対象記事を `read` で読む
            2. コメント本文の指示に従って記事を `edit` で編集する。指示が曖昧なら、記事の該当部分を確認しつつ最も近い意図の修正を実施する
            3. 編集後、同じファイルを `read` で読み返し、変更が正しく入っているか、文章のつながりが自然かを確認する
            4. 最終メッセージに実施した修正内容と理由を簡潔に書く

            ## ルール
            - コメントを「読んだ」だけで終わらせない。必ず記事ファイルへ実際の変更を書き込むこと
            - 削除指示なら該当箇所を削除し、書き換え指示なら書き換える
            - 修正対象は記事ファイルのみ。git コマンド / commit / push / ブランチ操作 / gh コマンドは使わない（GitHub Actions 基盤が自動で行う）
            - 指示に同意できない場合は、その理由と代替案を最終メッセージに書く（それでも編集しなかった理由を明確にする）