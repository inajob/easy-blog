name: write-article

on:
  issues:
    types: [opened, labeled]

jobs:
  write:
    if: contains(github.event.issue.labels.*.name, 'article')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run OpenCode (article-writer)
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          agent: article-writer
          use_github_token: true
          prompt: |
            # 記事執筆
            この Issue を読み、レビューブログの記事を執筆してください。

            ## 手順
            1. Issue 本文から種ページの URL を取得し、必ず webfetch で内容を読む
            2. 記載があれば「推しポイント」を必ず反映する
            3. article-writer エージェントの執筆規約に従い記事を書く
            4. 保存先: src/content/posts/YYYY-MM-DD-<slug>.md（今日の日付・半角 slug）
            5. 記事を PR として開く。PR 説明に記事の要約と種ページ URL を記載する

            ## 注意
            - 同じ Issue からの重複 PR は作らない。既に同種の PR がある場合はそれを更新する
            - 元ページを読まないまま記事を書くことは禁止