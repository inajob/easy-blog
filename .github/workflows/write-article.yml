name: write-article

on:
  issues:
    types: [opened]

jobs:
  write:
    if: contains(github.event.issue.labels.*.name, 'article')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Configure git auth (use_github_token mode)
        run: |
          git config --local user.name "opencode-agent[bot]"
          git config --local user.email "opencode-agent[bot]@users.noreply.github.com"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Fetch OGP image from seed URL
        timeout-minutes: 2
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          node scripts/fetch-ogp.mjs --issue-body "$ISSUE_BODY"
          cat ogp-context/info.json 2>/dev/null || true
      - name: Run OpenCode (article-writer)
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/big-pickle
          agent: article-writer
          use_github_token: true
          prompt: |
            # 記事執筆
            この Issue を読み、レビューブログの記事を執筆してください。

            ## 手順
            1. Issue 本文から種ページの URL を取得し、必ず webfetch で内容を読む
            2. `ogp-context/info.json` が存在し `image_url` が null でない場合、その値を
               `![説明](<image_url>)` 形式の Markdown 画像として記事本文中（導入の直後など）に埋め込む。
               `title` を画像の説明に、`description` を記事の推敲の参考に使ってよい。ファイルが無い
               （または画像が無い）場合は画像なしで通常どおり書く
            3. 記載があれば「推しポイント」を必ず反映する
            4. article-writer エージェントの執筆規約に従い記事を書く
            5. 保存先: src/content/posts/YYYY-MM-DD-<slug>.md（今日の日付・半角 slug）に実際にファイルを書き出す
            6. 書き出したファイルを read で読み返し、内容が正しく保存されていることを確認する

            ## 注意
            - PR の作成・ブランチ操作・git コマンド・gh コマンドは一切行わないこと（push・PR 作成は GitHub Actions 基盤が自動で行う）
            - 元ページを読まないまま記事を書くことは禁止